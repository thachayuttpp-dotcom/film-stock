function BarcodeImg({value,height=50}){
  const ref=useRef(null);
  useEffect(()=>{
    if(ref.current&&window.JsBarcode&&value){
      try{ JsBarcode(ref.current,value,{format:"CODE128",width:1.8,height,displayValue:true,fontSize:11,margin:6,background:"#fff"}); }catch{}

}

// ========== SCANNER MODAL ==========
function ScannerModal({onScan,onClose,title="สแกนบาร์โค้ด"}){
  const [status,setStatus]=useState("กำลังเปิดกล้อง...");
  const [error,setError]=useState("");
  const scannerRef=useRef(null);
  const activeRef=useRef(false);

  useEffect(()=>{
    let scanner=null;
    const start=async()=>{
      try{
        scanner=new Html5Qrcode("qr-scan-box");
        scannerRef.current=scanner;
        await scanner.start(
          {facingMode:"environment"},
          {fps:10, qrbox:{width:260,height:110},
           aspectRatio:1.5,
           formatsToSupport:[
             Html5QrcodeSupportedFormats.QR_CODE,
             Html5QrcodeSupportedFormats.CODE_128,
             Html5QrcodeSupportedFormats.EAN_13,
             Html5QrcodeSupportedFormats.EAN_8,
             Html5QrcodeSupportedFormats.CODE_39,
             Html5QrcodeSupportedFormats.UPC_A,
           ]},
          (text)=>{
            if(activeRef.current)return;
            activeRef.current=true;
            navigator.vibrate&&navigator.vibrate(100);
            scanner.stop().then(()=>onScan(text)).catch(()=>onScan(text));
          },
          ()=>{}
        );
        setStatus("พร้อมสแกน — เล็งที่บาร์โค้ด");
      }catch(e){
        setError("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้องก่อน");
      }
    };
    start();
    return ()=>{
      if(scannerRef.current){
        try{scannerRef.current.stop().catch(()=>{});}catch{}
      }
    };
  },[]);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:300,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{color:"#fff",fontSize:16,fontWeight:700,marginBottom:16}}>{title}</div>
      {error?
        <div style={{background:"#FEE2E2",color:"#EF4444",borderRadius:12,padding:16,fontSize:14,textAlign:"center",maxWidth:300}}>{error}</div>:
        <>
          <div style={{borderRadius:16,overflow:"hidden",background:"#000",width:"100%",maxWidth:340}}>
            <div id="qr-scan-box"/>
          </div>
          <div style={{color:"rgba(255,255,255,0.7)",fontSize:13,marginTop:12,textAlign:"center",animation:"pulse 1.5s infinite"}}>{status}</div>
          <div style={{marginTop:8,background:"rgba(255,255,255,0.1)",borderRadius:8,padding:"6px 14px"}}>
            <div style={{color:"rgba(255,255,255,0.5)",fontSize:11,textAlign:"center"}}>รองรับ QR Code, Barcode, EAN-13</div>
          </div>
        </>
      }
      <button onClick={onClose} style={{marginTop:20,background:"rgba(255,255,255,0.15)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:12,padding:"12px 32px",fontSize:14,fontWeight:600,cursor:"pointer"}}>
        ✕ ยกเลิก
      </button>
    </div>
  );
}

function StockIn({products,onSubmit}){
  const [pid,setPid]=useState("");
  const [qty,setQty]=useState("");
  const [note,setNote]=useState("");
  const [search,setSearch]=useState("");
  const [done,setDone]=useState(false);
  const [scanOpen,setScanOpen]=useState(false);

  const filtered=products.filter(p=>p.model.toLowerCase().includes(search.toLowerCase())||p.brand.toLowerCase().includes(search.toLowerCase()));
  const selected=products.find(p=>p.id===pid);

  const handleScan=code=>{
    setScanOpen(false);
    const found=products.find(p=>p.barcode===code||genBC(p.id.replace("p",""))===code);
    if(found){setPid(found.id);setSearch(found.model);}
    else{setSearch(code);}
  };

  const handle=()=>{
    if(!pid||!qty)return;
    onSubmit({productId:pid,qty:Number(qty),note:note||"รับสินค้าเข้า",type:"in"});
    setDone(true);
    setTimeout(()=>{setDone(false);setPid("");setQty("");setNote("");setSearch("");},2200);
  };

  if(done) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60vh",gap:16}}>
      <div style={{width:64,height:64,background:"#D1FAE5",borderRadius:32,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="check" size={32} color="#10B981"/></div>
      <div style={{fontSize:17,fontWeight:700}}>บันทึกสำเร็จ!</div>
      <div style={{fontSize:14,color:"#64748B"}}>รับ {qty} ชิ้น — {selected?.model}</div>
    </div>
  );

  return(
    <div style={{padding:20}}>
      {scanOpen&&<ScannerModal title="สแกนบาร์โค้ดสินค้า" onScan={handleScan} onClose={()=>setScanOpen(false)}/>}
      <h2 style={{fontWeight:800,fontSize:18,margin:"0 0 16px"}}>รับสินค้าเข้า</h2>

      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <div style={{position:"relative",flex:1}}>
          <div style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)"}}><Icon name="search" size={15} color="#94A3B8"/></div>
          <input value={search} onChange={e=>{setSearch(e.target.value);setPid("");}} placeholder="ค้นหาหรือพิมพ์ชื่อรุ่น..." style={{width:"100%",padding:"10px 10px 10px 33px",borderRadius:12,border:"1.5px solid #E2E8F0",fontSize:14,boxSizing:"border-box",outline:"none"}}/>
        </div>
        <button onClick={()=>setScanOpen(true)} style={{background:"#4F46E5",border:"none",borderRadius:12,width:44,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
          <Icon name="camera" size={18} color="#fff"/>
        </button>
      </div>

      {!pid&&search&&filtered.length>0&&(
        <div style={{background:"#fff",borderRadius:12,border:"1.5px solid #E2E8F0",overflow:"hidden",marginBottom:14,maxHeight:210,overflowY:"auto"}}>
          {filtered.slice(0,8).map(p=>(
            <div key={p.id} onClick={()=>{setPid(p.id);setSearch(p.model);}} style={{padding:"11px 14px",borderBottom:"1px solid #F1F5F9",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:13,fontWeight:600}}>{p.model}</div><div style={{fontSize:11,color:"#94A3B8"}}>{p.type}</div></div>
              <div style={{fontSize:12,color:"#64748B"}}>เหลือ {p.stock}</div>
            </div>
          ))}
        </div>
      )}

      {selected&&<div style={{background:"#EEF2FF",borderRadius:12,padding:14,marginBottom:14,border:"1.5px solid #C7D2FE"}}>
        <div style={{fontSize:13,fontWeight:700,color:"#4F46E5"}}>{selected.model}</div>
        <div style={{fontSize:12,color:"#6366F1",marginTop:2}}>สต็อกปัจจุบัน: {selected.stock} ชิ้น</div>
      </div>}

      <div style={{marginBottom:14}}>
        <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>จำนวนที่รับ *</label>
        <input value={qty} onChange={e=>setQty(e.target.value)} type="number" placeholder="0" style={{width:"100%",padding:"14px",borderRadius:12,border:"1.5px solid #E2E8F0",fontSize:20,fontWeight:700,boxSizing:"border-box",outline:"none",textAlign:"center"}}/>
      </div>
      <div style={{marginBottom:20}}>
        <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>หมายเหตุ</label>
        <input value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น รับจากซัพพลายเออร์ ABC" style={{width:"100%",padding:"10px 12px",borderRadius:12,border:"1.5px solid #E2E8F0",fontSize:14,boxSizing:"border-box",outline:"none"}}/>
      </div>
      <button onClick={handle} disabled={!pid||!qty} style={{width:"100%",padding:14,borderRadius:14,border:"none",background:pid&&qty?"#10B981":"#E2E8F0",color:pid&&qty?"#fff":"#94A3B8",fontSize:15,fontWeight:700,cursor:pid&&qty?"pointer":"not-allowed"}}>
        ✓ บันทึกรับสินค้า
      </button>
    </div>
  );
}

// ========== STOCK OUT ==========
function StockOut({products,onSubmit}){
  const [pid,setPid]=useState("");
  const [qty,setQty]=useState("");
  const [note,setNote]=useState("");
  const [search,setSearch]=useState("");
  const [done,setDone]=useState(false);
  const [err,setErr]=useState("");
  const [scanOpen,setScanOpen]=useState(false);

  const filtered=products.filter(p=>p.model.toLowerCase().includes(search.toLowerCase())||p.brand.toLowerCase().includes(search.toLowerCase()));
  const selected=products.find(p=>p.id===pid);

  const handleScan=code=>{
    setScanOpen(false);
    const found=products.find(p=>p.barcode===code||genBC(p.id.replace("p",""))===code);
    if(found){setPid(found.id);setSearch(found.model);}
    else{setSearch(code);}
  };

  const handle=()=>{
    if(!pid||!qty)return;
    if(Number(qty)>selected.stock){setErr("จำนวนมากกว่าสต็อกที่มี");return;}
    setErr("");
    onSubmit({productId:pid,qty:Number(qty),note:note||"จ่ายสินค้าออก",type:"out"});
    setDone(true);
    setTimeout(()=>{setDone(false);setPid("");setQty("");setNote("");setSearch("");},2200);
  };

  if(done) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60vh",gap:16}}>
      <div style={{width:64,height:64,background:"#FEE2E2",borderRadius:32,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="minus" size={32} color="#EF4444"/></div>
      <div style={{fontSize:17,fontWeight:700}}>บันทึกสำเร็จ!</div>
      <div style={{fontSize:14,color:"#64748B"}}>จ่าย {qty} ชิ้น — {selected?.model}</div>
    </div>
  );

  return(
    <div style={{padding:20}}>
      {scanOpen&&<ScannerModal title="สแกนบาร์โค้ดสินค้า" onScan={handleScan} onClose={()=>setScanOpen(false)}/>}
      <h2 style={{fontWeight:800,fontSize:18,margin:"0 0 16px"}}>จ่ายสินค้าออก</h2>

      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <div style={{position:"relative",flex:1}}>
          <div style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)"}}><Icon name="search" size={15} color="#94A3B8"/></div>
          <input value={search} onChange={e=>{setSearch(e.target.value);setPid("");}} placeholder="ค้นหาหรือพิมพ์ชื่อรุ่น..." style={{width:"100%",padding:"10px 10px 10px 33px",borderRadius:12,border:"1.5px solid #E2E8F0",fontSize:14,boxSizing:"border-box",outline:"none"}}/>
        </div>
        <button onClick={()=>setScanOpen(true)} style={{background:"#EF4444",border:"none",borderRadius:12,width:44,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
          <Icon name="camera" size={18} color="#fff"/>
        </button>
      </div>

      {!pid&&search&&filtered.length>0&&(
        <div style={{background:"#fff",borderRadius:12,border:"1.5px solid #E2E8F0",overflow:"hidden",marginBottom:14,maxHeight:210,overflowY:"auto"}}>
          {filtered.slice(0,8).map(p=>(
            <div key={p.id} onClick={()=>{setPid(p.id);setSearch(p.model);}} style={{padding:"11px 14px",borderBottom:"1px solid #F1F5F9",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:13,fontWeight:600}}>{p.model}</div><div style={{fontSize:11,color:"#94A3B8"}}>{p.type}</div></div>
              <div style={{fontSize:12,fontWeight:700,color:p.stock===0?"#EF4444":p.stock<=p.minStock&&p.minStock>0?"#F59E0B":"#10B981"}}>เหลือ {p.stock}</div>
            </div>
          ))}
        </div>
      )}

      {selected&&<div style={{background:selected.stock<=selected.minStock&&selected.minStock>0?"#FEF3C7":"#F0FDF4",borderRadius:12,padding:14,marginBottom:14,border:`1.5px solid ${selected.stock<=selected.minStock&&selected.minStock>0?"#FCD34D":"#86EFAC"}`}}>
        <div style={{fontSize:13,fontWeight:700}}>{selected.model}</div>
        <div style={{fontSize:12,color:"#64748B",marginTop:2}}>สต็อกปัจจุบัน: <span style={{fontWeight:700,color:selected.stock<=selected.minStock&&selected.minStock>0?"#F59E0B":"#10B981"}}>{selected.stock} ชิ้น</span></div>
      </div>}

      <div style={{marginBottom:14}}>
        <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>จำนวนที่จ่าย *</label>
        <input value={qty} onChange={e=>{setQty(e.target.value);setErr("");}} type="number" placeholder="0" style={{width:"100%",padding:"14px",borderRadius:12,border:`1.5px solid ${err?"#EF4444":"#E2E8F0"}`,fontSize:20,fontWeight:700,boxSizing:"border-box",outline:"none",textAlign:"center"}}/>
        {err&&<div style={{fontSize:12,color:"#EF4444",marginTop:4}}>⚠ {err}</div>}
        {selected&&qty&&!err&&Number(qty)<=selected.stock&&<div style={{fontSize:12,color:"#10B981",marginTop:4}}>จะเหลือ {selected.stock-Number(qty)} ชิ้น</div>}
      </div>
      <div style={{marginBottom:20}}>
        <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>ชื่อร้านค้า / หมายเหตุ</label>
        <input value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น ขายร้านทอมมี่โฟน" style={{width:"100%",padding:"10px 12px",borderRadius:12,border:"1.5px solid #E2E8F0",fontSize:14,boxSizing:"border-box",outline:"none"}}/>
      </div>
      <button onClick={handle} disabled={!pid||!qty} style={{width:"100%",padding:14,borderRadius:14,border:"none",background:pid&&qty?"#EF4444":"#E2E8F0",color:pid&&qty?"#fff":"#94A3B8",fontSize:15,fontWeight:700,cursor:pid&&qty?"pointer":"not-allowed"}}>
        − บันทึกจ่ายสินค้า
      </button>
    </div>
  );
}

// ========== HISTORY ==========
function History({products,transactions}){
  const [filter,setFilter]=useState("ทั้งหมด");
  const sorted=[...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const filtered=sorted.filter(tx=>filter==="ทั้งหมด"||(filter==="รับเข้า"&&tx.type==="in")||(filter==="จ่ายออก"&&tx.type==="out"));
  return(
    <div style={{padding:20}}>
      <h2 style={{fontWeight:800,fontSize:18,margin:"0 0 14px"}}>ประวัติการเคลื่อนไหว</h2>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {["ทั้งหมด","รับเข้า","จ่ายออก"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} style={{padding:"6px 14px",borderRadius:20,border:"1.5px solid",borderColor:filter===f?"#4F46E5":"#E2E8F0",background:filter===f?"#EEF2FF":"#fff",color:filter===f?"#4F46E5":"#64748B",fontSize:12,fontWeight:600,cursor:"pointer"}}>{f}</button>
        ))}
      </div>
      {filtered.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#94A3B8"}}>ไม่มีรายการ</div>}
      {filtered.map(tx=>{const p=products.find(x=>x.id===tx.productId);return(
        <div key={tx.id} style={{background:"#fff",borderRadius:14,padding:"12px 14px",marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,0.06)",display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:40,height:40,borderRadius:12,background:tx.type==="in"?"#D1FAE5":"#FEE2E2",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Icon name={tx.type==="in"?"plus":"minus"} size={18} color={tx.type==="in"?"#10B981":"#EF4444"}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p?.model||"-"}</div>
            <div style={{fontSize:11,color:"#94A3B8"}}>{tx.note}</div>
            <div style={{fontSize:10,color:"#CBD5E1",marginTop:1}}>{fmt(tx.date)}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:16,fontWeight:800,color:tx.type==="in"?"#10B981":"#EF4444"}}>{tx.type==="in"?"+":"-"}{tx.qty}</div>
            <div style={{fontSize:10,color:"#94A3B8"}}>ชิ้น</div>
          </div>
        </div>
      );})}
    </div>
  );
}

// ========== APP ==========
function App(){
  const [tab,setTab]=useState("dashboard");
  const [products,setProducts]=useState(()=>DB.get("film-products-v2",ALL_PRODUCTS));
  const [transactions,setTransactions]=useState(()=>DB.get("film-tx-v2",[]));
  const [showAdd,setShowAdd]=useState(false);
  const [bcProduct,setBcProduct]=useState(null);

  const handleTx=useCallback(({productId,qty,note,type})=>{
    const tx={id:"t"+Date.now(),productId,qty,note,type,date:new Date().toISOString()};
    const np=products.map(p=>p.id===productId?{...p,stock:type==="in"?p.stock+qty:Math.max(0,p.stock-qty)}:p);
    const nt=[tx,...transactions];
    setProducts(np);setTransactions(nt);
    DB.set("film-products-v2",np);DB.set("film-tx-v2",nt);
  },[products,transactions]);

  const handleAdd=useCallback(form=>{
    const np=[...products,{id:"p"+Date.now(),...form}];
    setProducts(np);DB.set("film-products-v2",np);
    setShowAdd(false);setTab("stock");
  },[products]);

  const handleAssignBarcode=useCallback((productId,code)=>{
    const np=products.map(p=>p.id===productId?{...p,barcode:code}:p);
    setProducts(np);DB.set("film-products-v2",np);
    setBcProduct(np.find(p=>p.id===productId));
  },[products]);

  const nav=[
    {id:"dashboard",icon:"dashboard",label:"หน้าหลัก"},
    {id:"stock",icon:"stock",label:"สต็อก"},
    {id:"in",icon:"plus",label:"รับเข้า"},
    {id:"out",icon:"minus",label:"จ่ายออก"},
    {id:"history",icon:"history",label:"ประวัติ"},
  ];
  const lowCount=products.filter(p=>p.stock<=p.minStock&&p.minStock>0).length;

  return(
    <div style={{maxWidth:430,margin:"0 auto",background:"#F8FAFC",minHeight:"100vh",position:"relative",paddingBottom:72}}>
      <div style={{minHeight:"calc(100vh - 72px)",overflowY:"auto"}}>
        {tab==="dashboard"&&<Dashboard products={products} transactions={transactions}/>}
        {tab==="stock"&&<StockList products={products} onAddProduct={()=>setShowAdd(true)} onAssignBarcode={p=>{setBcProduct(p);}}/>}
        {tab==="in"&&<StockIn products={products} onSubmit={handleTx}/>}
        {tab==="out"&&<StockOut products={products} onSubmit={handleTx}/>}
        {tab==="history"&&<History products={products} transactions={transactions}/>}
      </div>

      <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#fff",borderTop:"1px solid #F1F5F9",display:"flex",zIndex:50,boxShadow:"0 -4px 20px rgba(0,0,0,0.08)"}}>
        {nav.map(item=>{
          const active=tab===item.id;
          const ac=item.id==="in"?"#10B981":item.id==="out"?"#EF4444":"#4F46E5";
          const abg=item.id==="in"?"#D1FAE5":item.id==="out"?"#FEE2E2":"#EEF2FF";
          const isAlert=item.id==="stock"&&lowCount>0;
          return(
            <button key={item.id} onClick={()=>setTab(item.id)} style={{flex:1,padding:"10px 4px 8px",border:"none",background:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",position:"relative"}}>
              <div style={{width:36,height:36,borderRadius:12,background:active?abg:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s"}}>
                <Icon name={item.icon} size={18} color={active?ac:"#94A3B8"}/>
                {isAlert&&<div style={{position:"absolute",top:6,right:"calc(50% - 18px)",width:8,height:8,background:"#EF4444",borderRadius:4,border:"2px solid #fff"}}/>}
              </div>
              <span style={{fontSize:10,fontWeight:active?700:500,color:active?ac:"#94A3B8"}}>{item.label}</span>
            </button>
          );
        })}
      </nav>

      {showAdd&&<AddProductModal onSave={handleAdd} onClose={()=>setShowAdd(false)} allProducts={products}/>}
      {bcProduct&&<ProductBarcodeModal product={bcProduct} onAssign={handleAssignBarcode} onClose={()=>setBcProduct(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
